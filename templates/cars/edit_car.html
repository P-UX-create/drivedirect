{% extends "base.html" %}

{% block title %}Edit Car{% endblock %}

{% block content %}

<h1>Edit Car</h1>

<form method="POST">

<input type="text" name="brand" value="{{ car.brand }}" required>

<input type="text" name="model" value="{{ car.model }}" required>

<input type="number" name="year" value="{{ car.year }}" required>

<input type="text" name="plate_number" value="{{ car.plate_number }}" required>

<input type="number" step="0.01" name="price_per_day" value="{{ car.price_per_day }}" required>

<input type="text" name="fuel_type" value="{{ car.fuel_type }}">

<input type="text" name="transmission" value="{{ car.transmission }}">

<select name="status">

<option value="Available">Available</option>

<option value="Rented">Rented</option>

<option value="Maintenance">Maintenance</option>

</select>

<button type="submit">

Update Car

</button>

</form>

{% endblock %}
