{% extends "base.html" %}

{% block title %}Add Car{% endblock %}

{% block content %}

<h1>Add Car</h1>

<form method="POST" enctype = "multipart/form-data">

<input type="text" name="brand" placeholder="Brand" required>

<input type="text" name="model" placeholder="Model" required>

<input type="number" name="year" placeholder="Year" required>

<input type="text" name="plate_number" placeholder="Plate Number" required>

<input type="number" step="0.01" name="price_per_day" placeholder="Price Per Day" required>

<input type="text" name="fuel_type" placeholder="Fuel Type">

<input type="text" name="transmission" placeholder="Transmission">

<label>Vehicle Image</label>

<input type="file" name="image">

<button type="submit">

Save Car

</button>

</form>

{% endblock %}
