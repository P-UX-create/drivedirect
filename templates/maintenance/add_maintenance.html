{% extends "base.html" %}

{% block title %}Add Maintenance{% endblock %}

{% block content %}

<h1>Add Maintenance</h1>

<form method="POST">

<label>Car</label>

<select name="car">

{% for car in cars %}

<option value="{{ car.id }}">
{{ car.brand }} {{ car.model }}
</option>

{% endfor %}

</select>

<label>Service Date</label>

<input type="date" name="service_date" required>

<label>Description</label>

<textarea name="description" required></textarea>

<label>Mechanic</label>

<input type="text" name="mechanic" required>

<label>Cost</label>

<input type="number" step="0.01" name="cost" required>

<label>Next Service Date</label>

<input type="date" name="next_service" required>

<button type="submit">
Save Record
</button>

</form>

{% endblock %}
